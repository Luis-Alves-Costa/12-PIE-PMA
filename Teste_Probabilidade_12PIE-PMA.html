<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>P5 – Probabilidade · Teste por níveis · 12.º PIE/PMA</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1f2a37;--mu:#5b6670;--ac:#2563eb;--ok:#15803d;--ko:#b91c1c;--bd:#d5dbe1;--fg:#1f2a37;--grid:#e3e8ee;--ax:#5b6670}
@media(prefers-color-scheme:dark){:root{--bg:#10151b;--card:#1a222c;--tx:#e8edf2;--mu:#9aa6b2;--ac:#60a5fa;--ok:#4ade80;--ko:#f87171;--bd:#34404d;--fg:#e8edf2;--grid:#2a3540;--ax:#9aa6b2}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
main{padding:16px}
#wrap{max-width:680px;margin:auto}
#side{padding:0 16px 16px}
#side:empty{display:none}
@media(min-width:1000px){#wrap.dual{max-width:1140px;display:grid;grid-template-columns:minmax(0,700px) 400px;gap:8px;align-items:start}#wrap.dual #side{position:sticky;top:10px;padding:16px 16px 16px 0;max-height:calc(100vh - 20px);overflow:auto}}
.passo{display:flex;gap:8px;align-items:flex-start;padding:7px 8px;border-radius:10px;margin:4px 0;font-size:.9rem}
.passo.cur{background:color-mix(in srgb,var(--ac) 14%,var(--card));border:1px solid var(--ac)}
.passo.ok{opacity:.6}.passo .n{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-weight:700;background:var(--bd)}
.passo.cur .n{background:var(--ac);color:#fff}.passo.ok .n{background:var(--ok);color:#fff}
#fbtn{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40;border-radius:99px;padding:10px 16px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.formul h3{font-size:1rem;margin:12px 0 4px}.formul p{margin:3px 0;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px}
h1{font-size:1.45rem;margin:0 0 6px}h2{font-size:1.1rem;margin:0 0 10px}
.mu{color:var(--mu);font-size:.9rem}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;margin:8px 0 14px}.bar i{display:block;height:100%;background:var(--ac)}
button{font:inherit;cursor:pointer}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:2px solid var(--bd);border-radius:12px;padding:13px 14px;margin:0 0 10px;min-height:50px}
.opt.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,var(--card))}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:14px 18px;min-height:50px;font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
.btn.sec{background:transparent;color:var(--ac);border:2px solid var(--ac)}
.col{display:flex;flex-direction:column;gap:10px}
.nav{display:flex;gap:10px}.nav .btn{flex:1}
input{font:inherit;width:100%;padding:12px;border:2px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);margin:6px 0 14px}
.tag{display:inline-block;font-size:.8rem;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--bd)}
.score{font-size:3rem;font-weight:800;color:var(--ac);line-height:1}
.m{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.95em;white-space:nowrap}
.opt .m{font-size:.84em;white-space:normal}
h2 .m{white-space:normal}
.fig{display:block;width:100%;max-width:420px;height:auto;margin:6px auto 12px}
.fig text{font:13px system-ui,sans-serif;fill:var(--fg)}
/* desenho progressivo das figuras */
svg.anim .dr{stroke-dasharray:1 1;stroke-dashoffset:1;animation:dr .75s ease-in-out forwards}
svg.anim .fd{opacity:0;animation:fd .7s ease forwards}
svg.anim .gr{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.2);animation:gr 1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes dr{to{stroke-dashoffset:0}}@keyframes fd{to{opacity:1}}@keyframes gr{to{opacity:1;transform:scale(1)}}
@media(prefers-reduced-motion:reduce){svg.anim *{animation:none!important;opacity:1!important;stroke-dashoffset:0!important;transform:none!important}}
table{width:100%;border-collapse:collapse;font-size:.95rem}td,th{border-bottom:1px solid var(--bd);padding:7px 4px;text-align:left}
.mc{display:inline-block;margin-top:6px;padding:4px 14px;border-radius:99px;font-weight:700;background:color-mix(in srgb,var(--ac) 16%,var(--card));color:var(--ac)}
.ko{color:var(--ko)}
.dlg{position:fixed;inset:0;background:rgba(10,15,25,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:12px}
.dlgc{background:var(--card);color:var(--tx);border-radius:16px;padding:18px;max-width:560px;width:100%;max-height:85vh;overflow:auto}
.fb{border-left:6px solid var(--ko);padding:10px 12px;background:var(--bg);border-radius:8px;margin-top:6px}.fb.ok{border-left-color:var(--ok)}
.lvl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.lvl div{border:1px solid var(--bd);border-radius:10px;padding:8px;text-align:center;font-size:.9rem}
.lvl b{display:block;font-size:1.15rem}
footer{text-align:center;padding:1.2rem 1rem 2rem;font-size:.85rem;color:var(--mu)}
@media print{body{background:#fff;color:#000}.nop{display:none!important}.card{border:1px solid #999}}
/* ===== Cabeçalho institucional padrão (ESMP) ===== */
header.header-institucional,header.header-institucional *{box-sizing:border-box}
header.header-institucional{flex:0 0 auto;background:#fffefe;color:#333;border-bottom:4px solid #003b66;padding:1rem 1.5rem;box-shadow:0 3px 10px rgba(0,0,0,.08);font-family:Arial,Helvetica,sans-serif;line-height:1.6;text-align:left}
header.header-institucional .header-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;margin:0 0 1rem}
header.header-institucional .header-logo{height:56px;width:auto;object-fit:contain}
header.header-institucional .header-center{text-align:center;flex-grow:1}
header.header-institucional .header-center h1{font-size:clamp(1.5rem,3.4vw,2.2rem);font-weight:800;letter-spacing:-.01em;line-height:1.2;color:#0b1b2b;margin:0 0 .45rem;padding:0}
header.header-institucional .header-info{display:flex;justify-content:space-around;align-items:center;flex-wrap:wrap;gap:.5rem 1.5rem;font-size:1rem;color:#222}
header.header-institucional .header-emblema{height:40px;width:auto;border-radius:4px}
header.header-institucional .header-curso{display:inline-flex;align-items:center;justify-content:center;gap:.55rem;text-align:left}
header.header-institucional .header-curso .header-emblema{flex:none}
@media(max-width:700px){header.header-institucional .header-curso{gap:.45rem}header.header-institucional .header-curso .header-emblema{height:32px}}
header.header-institucional .header-rule{border:0;border-top:2px solid #000;margin:.9rem 0 0;height:0}
header.header-institucional .banner-ufcd{background-color:#fdeee6;text-align:center;padding:.5rem;font-weight:bold;color:#444;border-radius:4px;margin:.9rem 1.2rem 0;font-size:1.05rem}
@media(max-width:700px){header.header-institucional{padding:.6rem .8rem}header.header-institucional .header-top{flex-direction:row;justify-content:center;margin-bottom:.5rem}header.header-institucional .header-logo{height:34px}header.header-institucional .header-info{flex-direction:column;gap:.2rem;text-align:center}header.header-institucional .header-center h1{font-size:1.4rem}header.header-institucional .banner-ufcd{margin:.7rem 0 0}}

/* ===== Correção: logótipos alinhados à esquerda, ao centro e à direita (também no telemóvel) ===== */
header.header-institucional .header-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.75rem;margin:0 0 1rem}
header.header-institucional .header-top>.header-logo{min-width:0;max-width:100%}
header.header-institucional .header-top>.header-logo:nth-child(1){justify-self:start}
header.header-institucional .header-top>.header-logo:nth-child(2){justify-self:center}
header.header-institucional .header-top>.header-logo:nth-child(3){justify-self:end}
@media(max-width:700px){header.header-institucional .header-top{gap:.4rem;margin-bottom:.5rem}header.header-institucional .header-logo{height:34px}}
@media(max-width:360px){header.header-institucional .header-logo{height:28px}}

/* variante Matemática · 12.º PIE/PMA: faixa azul-clara, como no cabeçalho em papel */
header.header-institucional .banner-ufcd{background-color:#dde8f5;color:#1f2a37;font-weight:600}
header.header-institucional .banner-ufcd .sc{font-variant:small-caps;letter-spacing:.02em}
header.header-institucional .header-center h1{font-family:Arial,Helvetica,sans-serif}

</style>
</head>

<script>
"use strict";
/* ================= Configuração ================= */
const PROF_EMAIL="luis.costa@esmp.pt";      // destinatário do botão «Enviar ao professor»
const EXIGE_MAXIMO=false;                    // true = só pode passar de nível quem tiver 100 (ou 150) pontos
const MAX_NOVAS=2;                           // novas perguntas sobre o mesmo tema depois de um erro
const MAX_TROCAS=2;                          // perguntas que podem ser trocadas por um tema à escolha, em cada nível
const VALOR_TROCA=.5;
const GLOS_GRATIS=2;                         // pedidos de explicação gratuitos por nível
const PENAL_GLOSSARIO=.10, PENAL_GLOS_EXTRA=.01; // 3.º pedido: −10% no nível; cada pedido seguinte: −1% a mais
const CERTEZA_RISCO=.8;                      // acertar «a arriscar» vale 80%
const PENAL_CERTEZA=.10;                     // errar «com certeza» desconta 10% da cotação
const VALOR_JUST_ERRADA=.5;                  // pergunta em dois tempos: justificação errada → vale 50%
const DOIS_TEMPOS=[1,2];
const FACIL_OCT=.75;                         // ajuda «passar o sólido para o 1.º octante»: a pergunta passa a valer 75%                     // níveis (0 = Nível 1) com pergunta em dois tempos                        // fração da cotação que vale uma pergunta trocada (sem repetição)
const CREDITO=[1,.75,.5];                       // fração da cotação na 1.ª pergunta, na 1.ª nova e na 2.ª nova
const ESPERA_REVISAO_H=24;                   // horas até poder ver a revisão completa do teste
const CHAVE="PROB-12PIE-PMA-2026-v1", SAL="PROB-ESMP-PIE-PMA";

/* ================= Figuras ================= */
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
let ANIM=false; // true só quando a pergunta aparece pela primeira vez (a figura desenha-se)
function plano({pts=[],lns=[],R=5}){
  const W=340,u=W/(2*R+1),o=W/2,X=x=>o+x*u,Y=y=>o-y*u;
  let g=`<svg class="fig${ANIM?" anim":""}" viewBox="0 0 ${W} ${W}" role="img" aria-label="Referencial cartesiano">`;
  for(let k=-R;k<=R;k++)g+=`<line x1="${X(k)}" y1="${Y(-R-.5)}" x2="${X(k)}" y2="${Y(R+.5)}" stroke="var(--grid)"/><line x1="${X(-R-.5)}" y1="${Y(k)}" x2="${X(R+.5)}" y2="${Y(k)}" stroke="var(--grid)"/>`;
  g+=`<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="var(--ax)"/></marker></defs>`;
  g+=`<line x1="${X(-R-.5)}" y1="${Y(0)}" x2="${X(R+.5)}" y2="${Y(0)}" stroke="var(--ax)" stroke-width="1" stroke-opacity=".75" marker-end="url(#ar)"/><line x1="${X(0)}" y1="${Y(-R-.5)}" x2="${X(0)}" y2="${Y(R+.5)}" stroke="var(--ax)" stroke-width="1" stroke-opacity=".75" marker-end="url(#ar)"/>`;
  g+=`<text x="${X(R+.5)-6}" y="${Y(0)+16}">x</text><text x="${X(0)+8}" y="${Y(R+.5)+10}">y</text><text x="${X(0)-12}" y="${Y(0)+14}">O</text>`;
  for(let k=-R;k<=R;k++)if(k&&k%1==0){g+=`<text x="${X(k)-4}" y="${Y(0)+14}" style="font-size:10px;fill:var(--mu)">${N(k)}</text><text x="${X(0)-14}" y="${Y(k)+4}" style="font-size:10px;fill:var(--mu)">${N(k)}</text>`}
  const cols=["#4f7fe0","#e0706a","#3fae7c"];
  lns.forEach(([x1,y1,x2,y2,l],n)=>{const dx=x2-x1,dy=y2-y1,t=40;const ax=x1-t*dx,ay=y1-t*dy,bx=x1+t*dx,by=y1+t*dy;
    g+=`<clipPath id="cp${n}"><rect x="${X(-R-.5)}" y="${Y(R+.5)}" width="${(2*R+1)*u}" height="${(2*R+1)*u}"/></clipPath><line clip-path="url(#cp${n})" x1="${X(ax)}" y1="${Y(ay)}" x2="${X(bx)}" y2="${Y(by)}" stroke="${cols[n%3]}" stroke-width="1.4" pathLength="1" class="dr" style="animation-delay:${.3+n*.8}s;animation-duration:1.6s"/>`;
    // etiqueta perto da margem
    let lx=x1,ly=y1;for(let s=0;s<40;s+=.05){const tx=x1+dx*s,ty=y1+dy*s;if(Math.abs(tx)>R-1||Math.abs(ty)>R-.8)break;lx=tx;ly=ty}
    g+=`<text x="${X(lx)+6}" y="${Y(ly)}" class="fd" style="font-weight:500;font-style:italic;fill:${cols[n%3]};animation-delay:${1.1+n*.8}s">${l}</text>`});
  pts.forEach(([x,y,l],j)=>{g+=`<g class="fd" style="animation-delay:${.2+j*.25}s"><circle cx="${X(x)}" cy="${Y(y)}" r="3" fill="var(--fg)" fill-opacity=".85"/><text x="${X(x)+6}" y="${Y(y)-6}" style="font-size:12px;font-weight:500">${l}</text></g>`});
  return g+"</svg>";
}
// Referencial no espaço (perspetiva cavaleira): x para a frente, y para a direita, z para cima.
// V={A:[x,y,z]}, E=[["A","B"]] arestas, FC=[["A","B","C"],…] faces, F=polígono destacado, cot=[["A","B","4"]] cotas.
// Faces translúcidas com sombreado; arestas escondidas (entre duas faces de costas) a tracejado; eixos coloridos com escala.
const COR_EIXO=["#e07a7a","#58b884","#6b98e0"];
const COR_FACE=["#7c6cf2","#22b07d","#f2c14e","#ec7a5c","#3d8bfd","#e05d9b"];
function espaco({V,E,FC=[],F=null,cot=[],bb=[]}){
  const k=24,P=([x,y,z])=>[y*k-x*k*.55,-(z*k-x*k*.42)],VIEW=[1,.55,.42],LUZ=[.55,.45,.7];
  const pts=Object.values(V),ptB=[...pts,...bb],mx_=i=>Math.max(0,...ptB.map(p=>p[i]))+2.2,mn_=i=>Math.min(0,...ptB.map(p=>p[i]))-(ptB.some(p=>p[i]<0)?1.2:0);
  const ax=[0,1,2].map(i=>[mn_(i),mx_(i)]);
  const ends=[];ax.forEach(([a,b],i)=>{const e1=[0,0,0],e2=[0,0,0];e1[i]=a;e2[i]=b;ends.push(e1,e2)});
  const all=[...ptB,...ends].map(P),xs=all.map(p=>p[0]),ys=all.map(p=>p[1]),mx=Math.min(...xs)-24,my=Math.min(...ys)-20,W=Math.max(...xs)-mx+28,Hh=Math.max(...ys)-my+24;
  const Q=p=>{const [a,b]=P(p);return[a-mx,b-my]};
  const sb=(a,b)=>a.map((v,i)=>v-b[i]),dt=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0),cr=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
  const C0=[0,1,2].map(i=>pts.reduce((s,p)=>s+p[i],0)/pts.length);
  // faces: normal exterior, frente/costas, profundidade e sombreado
  const fs=FC.map((f,n)=>{const p=f.map(v=>V[v]),c=[0,1,2].map(i=>p.reduce((s,q)=>s+q[i],0)/p.length);let nr=cr(sb(p[1],p[0]),sb(p[2],p[0]));if(dt(nr,sb(c,C0))<0)nr=nr.map(x=>-x);
    const L=Math.hypot(...nr)||1,luz=Math.max(0,dt(nr,LUZ)/L/Math.hypot(...LUZ));return{f,c,frente:dt(nr,VIEW)>0,prof:dt(c,VIEW),luz,cor:COR_FACE[n%COR_FACE.length]}});
  let g=`<svg class="fig${ANIM?" anim":""}" viewBox="0 0 ${W.toFixed(0)} ${Hh.toFixed(0)}" role="img" aria-label="Figura no referencial do espaço">`;
  g+=`<defs>${[0,1,2].map(i=>`<marker id="ar3${i}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0,0L10,5L0,10z" fill="${COR_EIXO[i]}"/></marker>`).join("")}</defs>`;
  // posições ocupadas (vértices, etiquetas e cotas) para não sobrepor números da escala
  const vs0=Object.values(V).map(Q),cx0=vs0.reduce((s,p)=>s+p[0],0)/vs0.length,cy0=vs0.reduce((s,p)=>s+p[1],0)/vs0.length;
  const occ=[];vs0.forEach(p=>{occ.push(p);const dx=p[0]-cx0,dy=p[1]-cy0,n=Math.hypot(dx,dy)||1;occ.push([p[0]+dx/n*13,p[1]+dy/n*13])});
  cot.forEach(([a,b])=>{const p=Q(V[a]),q=Q(V[b]);occ.push([(p[0]+q[0])/2,(p[1]+q[1])/2])});
  const livre=(x,y)=>occ.every(([u,v])=>Math.hypot(u-x,v-y)>15);
  // eixos com marcas de escala
  ax.forEach(([a,b],i)=>{const e1=[0,0,0],e2=[0,0,0];e1[i]=a;e2[i]=b;const p=Q(e1),q=Q(e2),n="xyz"[i];
    g+=`<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="${COR_EIXO[i]}" stroke-width=".9" stroke-opacity=".8" marker-end="url(#ar3${i})" class="fd" style="animation-delay:${i*.12}s"/><text x="${q[0]+(n=="x"?-14:6)}" y="${q[1]+(n=="z"?4:12)}" class="fd" style="font-style:italic;font-weight:600;fill:${COR_EIXO[i]};animation-delay:${.2+i*.12}s">${n}</text>`;
    const passo=b-a>9?2:1;
    for(let t=Math.ceil(a);t<b-.8;t++){if(t===0||t%passo)continue;const e=[0,0,0];e[i]=t;const m=Q(e),tk=i===2?[5,0]:[0,5];
      g+=`<line x1="${m[0]-tk[0]/2}" y1="${m[1]-tk[1]/2}" x2="${m[0]+tk[0]/2}" y2="${m[1]+tk[1]/2}" stroke="${COR_EIXO[i]}" stroke-width=".7" stroke-opacity=".7" class="fd" style="animation-delay:.35s"/>`;
      const lx=m[0]+(i===2?-14:i===0?-12:-3),ly=m[1]+(i===2?4:i===0?2:14);
      if(livre(lx+3,ly-3))g+=`<text x="${lx}" y="${ly}" class="fd" style="font-size:8.5px;fill:${COR_EIXO[i]};opacity:.65;animation-delay:.4s">${t<0?"−"+(-t):t}</text>`}});
  if(!V.O){const o=Q([0,0,0]);g+=`<text x="${o[0]-12}" y="${o[1]+13}" style="font-size:10px;fill:var(--mu)">O</text>`}
  // faces, de trás para a frente
  const t0=.5,dE=.13,tF=t0+E.length*dE+.2;
  fs.slice().sort((a,b)=>a.prof-b.prof).forEach((o,j)=>{const pct=Math.round(55+45*o.luz);
    g+=`<polygon points="${o.f.map(v=>Q(V[v]).join(",")).join(" ")}" class="fd" style="fill:color-mix(in srgb,${o.cor} ${pct}%,#000);fill-opacity:${o.frente?.27:.17};stroke:none;animation-delay:${(tF+j*.12).toFixed(2)}s"/>`});
  if(F){g+=`<polygon points="${F.map(v=>Q(V[v]).join(",")).join(" ")}" class="fd" style="fill:var(--ac);fill-opacity:.38;stroke:var(--ac);stroke-width:1;stroke-linejoin:round;animation-delay:${(tF+fs.length*.12+.3).toFixed(2)}s"/>`}
  const tL=tF+fs.length*.12+.5;
  // arestas: escondida se todas as faces que a contêm estão de costas
  const esc_=(a,b)=>{const adj=fs.filter(o=>o.f.includes(a)&&o.f.includes(b));return adj.length>0&&adj.every(o=>!o.frente)};
  E.forEach(([a,b],j)=>{const p=Q(V[a]),q=Q(V[b]),h=esc_(a,b),dl=(t0+j*dE).toFixed(2);g+=`<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="var(--fg)" stroke-width="${h?.7:.95}" stroke-opacity="${h?.32:.55}" ${h?`stroke-dasharray="4 4" class="fd" style="animation-delay:${dl}s"`:`pathLength="1" class="dr" style="animation-delay:${dl}s"`} stroke-linecap="round"/>`});
  const vs=Object.values(V).map(Q),cx=vs.reduce((s,p)=>s+p[0],0)/vs.length,cy=vs.reduce((s,p)=>s+p[1],0)/vs.length;
  const out=(x,y,d)=>{let dx=x-cx,dy=y-cy,n=Math.hypot(dx,dy)||1;return[x+dx/n*d,y+dy/n*d+4]};
  for(const n in V){const p=Q(V[n]),[tx,ty]=out(p[0],p[1],13);g+=`<g class="fd" style="animation-delay:${tL.toFixed(2)}s"><circle cx="${p[0]}" cy="${p[1]}" r="1.5" fill="var(--fg)" fill-opacity=".45"/><text x="${tx}" y="${ty}" text-anchor="middle" style="font-size:11px;font-weight:400;fill:var(--fg);opacity:.62;paint-order:stroke;stroke:var(--card);stroke-width:2px;stroke-opacity:.8">${n}</text></g>`}
  cot.forEach(([a,b,t])=>{const p=Q(V[a]),q=Q(V[b]),[tx,ty]=out((p[0]+q[0])/2,(p[1]+q[1])/2,11);g+=`<text x="${tx}" y="${ty}" text-anchor="middle" class="fd" style="font-size:11px;fill:var(--ac);font-weight:500;paint-order:stroke;stroke:var(--card);stroke-width:2.5px;animation-delay:${(tL+.3).toFixed(2)}s">${t}</text>`});
  return g+"</svg>";
}


// Superfície esférica centrada na origem, com sombreado em gradiente, equador e meridianos, e eixos coloridos que a atravessam.
const PAL_ESF=[["#ff8a6b","#e2321f","#7a1309"],["#c3a6ff","#7b4fd6","#33196e"],["#a8e88a","#3fa34d","#14501f"],["#9cc8ff","#2f6fd6","#102f6b"]];
function esfera(R,pal=0){

  const P=([x,y,z])=>[cx+y*k-x*k*.5,cy-z*k+x*k*.38],id="esf"+R+"_"+pal;

  g+=`<circle cx="${cx}" cy="${cy}" r="${r0}" fill="url(#${id})" fill-opacity=".93" class="gr" style="animation-delay:.35s"/>`;
  g+=`<ellipse cx="${cx}" cy="${cy}" rx="${r0}" ry="${r0*.34}" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1.1" pathLength="1" class="dr" style="animation-delay:1.2s;animation-duration:1.2s"/>`;

  const o=P([0,0,0]);g+=`<g class="fd" style="animation-delay:2.8s"><circle cx="${o[0]}" cy="${o[1]}" r="2.8" fill="#fff"/><text x="${o[0]+6}" y="${o[1]+15}" style="font-weight:700;fill:#fff">O</text></g>`;

/* ================= Matemática auxiliar ================= */

function lin(c,v){let s="";c.forEach((a,i)=>{if(!a)return;const ab=Math.abs(a),t=(ab===1?"":ab)+v[i];s+=s?(a<0?" − ":" + ")+t:(a<0?"−":"")+t});return s||"0"}

  s+=(m.n<0?"−":"")+am+"x";if(b.n!==0)s+=(b.n<0?" − ":" + ")+fF({n:Math.abs(b.n),d:b.d});return s}

function gerar_(l,k,seed){
  const r=RNG(seed);

// referencial tocável (no plano); devolve pontos tocados
function gridToque(R,cb){const sv=document.querySelector("#cg svg");if(!sv)return;const W=340,u=W/(2*R+1),o=W/2;sv.style.cursor="crosshair";sv.style.touchAction="manipulation";
  sv.addEventListener("click",ev=>{const b=sv.getBoundingClientRect(),x=Math.round(((ev.clientX-b.left)/b.width*W-o)/u),y=Math.round((o-(ev.clientY-b.top)/b.height*W)/u);if(Math.abs(x)>R||Math.abs(y)>R)return;cb([x,y])})}
function construir(l,it){
  const k=it.inv,R=5;let pts=[],forma="octaedro";
  const desenha=()=>{const lns=k==="plano"&&pts.length===2&&(pts[0][0]!==pts[1][0]||pts[0][1]!==pts[1][1])?[[...pts[0],...pts[1],"r"]]:[];
    const nm=k==="plano"?["A","B"]:k==="poliedro"?["Partida"]:["1","2","3","4"];
    cg.innerHTML=plano({pts:pts.map((p,i)=>[...p,nm[i]||""]),lns,R});gridToque(R,toque)};
  const msg=t=>{cmsg.innerHTML=t};

  const toque=p=>{if(pts.length>=precisa)pts=[];if(pts.some(q=>q[0]===p[0]&&q[1]===p[1]))return;pts.push(p);desenha();valida()};
  const quadrado=()=>{const xs=[...new Set(pts.map(p=>p[0]))],ys=[...new Set(pts.map(p=>p[1]))];if(xs.length!==2||ys.length!==2)return null;
    const s=Math.abs(xs[0]-xs[1]);if(s!==Math.abs(ys[0]-ys[1]))return null;return{b0:[Math.min(...xs),Math.min(...ys)],s}};

  <div id="cg"></div><p class="mu" id="cmsg" style="text-align:center;margin:-4px 0 10px"></p>
  <button class="btn" id="cok" style="width:100%" disabled>${k==="plano"?"Concluir a construção":"Seguinte: desenhar o sólido"}</button></div>`;
  document.querySelectorAll("[data-pf]").forEach(b=>b.onclick=()=>{forma=b.dataset.pf;document.querySelectorAll("[data-pf]").forEach(x=>x.classList.toggle("sel",x===b))});
  desenha();valida();
  cok.onclick=()=>{if(k==="plano"){it.cons={tipo:"plano",A:pts[0],B:pts[1]};it.t=[{s:semente()}];save();pergunta();return}
    const base=k==="poliedro"?{tipo:"poliedro",forma,c0:pts[0]}:{tipo:k,...quadrado()};extrudir(l,it,base)};

// desenhar com o dedo: puxar para cima faz crescer o sólido
function extrudir(l,it,base){

  <div id="ex" style="touch-action:none;user-select:none"></div>

  <button class="btn" id="cfim" style="width:100%" disabled>Concluir a construção</button></div>`;
  const bb=base.tipo==="poliedro"?[[base.c0[0]+5,base.c0[1]+5,5],[base.c0[0]-5,base.c0[1]-5,-5]]:[[base.b0[0],base.b0[1],max+1]];
  const draw=()=>{const S=solidoCons(cfg());ex.innerHTML=espaco({...S,bb});
    const v=base.tipo==="cubo"?h:Math.round(h);hv.textContent=base.tipo==="cubo"?`altura ${fm(Math.round(h*10)/10)} de ${max}`:base.tipo==="piramide"?`altura ${v}`:`tamanho ${v}`;
    cfim.disabled=base.tipo==="cubo"?h<max:Math.round(h)<1;if(base.tipo==="cubo"&&h>=max)hv.textContent="Cubo completo ✔"};
  let y0=null,h0=0;const pxu=()=>{const sv=ex.querySelector("svg");if(!sv)return 24;const b=sv.getBoundingClientRect();return 24*b.height/sv.viewBox.baseVal.height};

    const pl=Math.min(.95,p*DIF[l]+dp),q=espPerg(1,pl);for(let j=0;j<n;j++)soma(LV[l].pts*fv,q)}

/* ================= Ajudas: equação vetorial e glossário ================= */
function introVet(q){
  const txt=q.t+q.o.join(" ");if(!/\(x,y,z\) =/.test(txt))return "";
  return `<details open class="intro" style="border:1px solid var(--bd);border-left:5px solid var(--ac);border-radius:10px;padding:8px 12px;margin:0 0 12px;font-size:.92rem"><summary style="cursor:pointer;font-weight:600">O que é uma equação vetorial da reta?</summary>
  <p style="margin:6px 0 0">Uma reta fica definida por um ponto P e por um <b>vetor diretor</b> v, que indica a sua direção. Todos os pontos da reta escrevem-se na forma <span class="m">(x,y,z) = P + k·v</span>, com k um número real: cada valor de k dá um ponto da reta. Por exemplo, em <span class="m">(x,y,z) = (1,2,0) + k(2,−1,3)</span>, com k = 1 obtém-se o ponto (3, 1, 3). Se a reta passa em A e B, um vetor diretor é <span class="m">B − A</span>; qualquer múltiplo dele (por exemplo, o dobro ou o simétrico) também serve.</p></details>`;
}
const GLOS=[
 ["Experiência aleatória","aleat|ao acaso","Experiência cujo resultado não se consegue prever, mesmo repetida nas mesmas condições."],
 ["Espaço de resultados","espaço de resultados","Conjunto de todos os resultados possíveis de uma experiência aleatória."],
 ["Acontecimento elementar","elementar","Acontecimento com um único resultado possível."],
 ["Acontecimento composto","composto","Acontecimento com mais do que um resultado possível."],
 ["Acontecimento certo e impossível","certo|impossível","Certo: acontece sempre (P = 1). Impossível: nunca acontece (P = 0)."],
 ["Acontecimento contrário","contrário|′","O contrário de A, escrito A′, tem os resultados que não pertencem a A: P(A′) = 1 − P(A)."],
 ["Interseção e reunião","∩|∪|«e»|«ou»","A ∩ B: ocorrem A e B. A ∪ B: ocorre pelo menos um deles."],
 ["Incompatíveis","incompatíve","Acontecimentos que não podem ocorrer ao mesmo tempo: A ∩ B é impossível."],
 ["Regra de Laplace","equilibrad|ao acaso","Com resultados igualmente prováveis: P(A) = casos favoráveis ÷ casos possíveis."],
 ["Frequência relativa","estim|frequência","Número de vezes que o acontecimento ocorre ÷ número de repetições; aproxima a probabilidade."],
 ["Probabilidade condicionada","sabendo|\\|","P(A | B) é a probabilidade de A, sabendo que B ocorreu: P(A ∩ B) ÷ P(B)."],
 ["Independência","independente","A e B são independentes se P(A ∩ B) = P(A) × P(B)."]
];
const termos=q=>{const txt=(q.t+" "+q.o.join(" ")).replace(/<[^>]+>/g,"");return GLOS.filter(g=>new RegExp(g[1],"i").test(txt))};
function glossario(l,q){

  const pl=k=>k===1?"1 explicação":k+" explicações",prox=n+1,custo=prox<=GLOS_GRATIS?0:prox===GLOS_GRATIS+1?PENAL_GLOSSARIO:PENAL_GLOS_EXTRA;
  const aviso=n===0?`<p class="mu" style="margin:0 0 10px">Os primeiros ${GLOS_GRATIS} pedidos de explicação em cada nível são gratuitos. O ${GLOS_GRATIS+1}.º faz descer a nota do nível em 10% e cada um a seguir desconta mais 1%.</p>`

  box.innerHTML=`<div class="fb" style="border-left-color:var(--ac);margin-top:10px"><p style="font-weight:700;margin:0 0 6px">Que termo não percebe?</p>${aviso}
  <div class="col" id="glt">${T.map((g,i)=>`<button class="opt" data-i="${i}" style="margin:0;padding:10px 12px;min-height:42px">${g[0]}</button>`).join("")}</div>

  <button class="btn sec" id="vt" style="width:100%">Não trocar: voltar à pergunta</button></div>`;
  tms.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;
    tms.innerHTML=`<div class="fb" style="border-left-color:#f2c14e"><p style="margin:0 0 8px">Trocar <b>«${tn(l,it)}»</b> por <b>«${TEMAS[l][k]}»</b>? A pergunta nova vale metade e a troca não pode ser desfeita.</p>
    <div class="nav"><button class="btn" id="tsim">Sim, trocar</button><button class="btn sec" id="tnao">Escolher outro tema</button></div></div>`;
    tsim.onclick=()=>{it.o=it.k;it.k=k;it.inv=null;it.t=[{s:semente()}];save();pergunta()};tnao.onclick=()=>trocar(l,it)});
  vt.onclick=pergunta;window.scrollTo(0,0);
}

/* ================= Voltar atrás antes de entregar ================= */
// perguntas erradas em que o aluno escolheu não repetir (e ainda tinha novas perguntas disponíveis)
const errosPorRever=()=>{const r=[];[0,1,2].forEach(l=>(S.it[l]||[]).forEach((it,j)=>{const t=it.t.filter(x=>x.a!==undefined&&x.a!==null);if(t.length&&t[t.length-1].a!==0&&it.t.length<1+MAX_NOVAS&&it.o===undefined&&!it.sk)r.push([l,j])}));return r};
const saltadas=()=>{const r=[];[0,1,2].forEach(l=>(S.it[l]||[]).forEach((it,j)=>{const u=it.t[it.t.length-1];if(it.sk&&(u.a===undefined||u.a===null))r.push([l,j])}));return r};
const podeVoltar=()=>(!S.usado.erros&&errosPorRever().length>0)||!S.usado.novas||saltadas().length>0;
function voltar(){
  const e=errosPorRever();
  app.innerHTML=`<div class="card"><span class="tag">Antes de entregar</span>
  <h2 style="margin-top:10px">Como quer concentrar-se de novo?</h2>
  <div class="col">
  ${saltadas().length?`<button class="btn" id="o0">Responder às perguntas que saltei (${saltadas().length})</button>
  <p class="mu" style="margin:0">Volta exatamente às mesmas perguntas, com a cotação completa.</p>`:""}
  <button class="btn" id="o1" ${S.usado.erros||!e.length?"disabled":""}>Voltar às perguntas que errei e não repeti (${e.length})</button>
  <p class="mu" style="margin:0">Recebe uma pergunta nova sobre o tema de cada erro. Se acertar, recupera a cotação dessa pergunta.</p>
  <button class="btn" id="o2" ${S.usado.novas?"disabled":""}>Pedir três perguntas novas, feitas para mim</button>
  <p class="mu" style="margin:0">Escolhe três temas em que te sentes à vontade. Cada resposta certa soma a cotação do nível, até ao máximo desse nível.</p>
  <button class="btn sec" id="o3">Voltar à nota</button></div></div>`;
  o1.onclick=()=>{if(S.usado.erros||!e.length)return;S.modo="erros";S.fila=e;S.fp=0;
    e.forEach(([l,j])=>{const it=S.it[l][j],vistos=it.t.map(x=>gq(l,it,x).t);let s,n=0;do{s=semente();n++}while(vistos.includes(gq(l,it,{s}).t)&&n<40);it.t.push({s});it.d=false});
    save();pergunta()};
  o2.onclick=()=>{if(!S.usado.novas)escolha(0)};
  if(window.o0)o0.onclick=()=>{const f=saltadas();if(!f.length)return;S.modo="saltadas";S.fila=f;S.fp=0;save();pergunta()};
  o3.onclick=final;window.scrollTo(0,0);
}
function escolha(l,modo){
  modo=modo||"temas";
  const tabs=`<div class="lvl" style="margin:10px 0">${[["temas","Escolher temas"]].map(([m_,t])=>`<button class="opt ${m_===modo?"sel":""}" data-m="${m_}" style="text-align:center;margin:0;padding:8px 6px;font-size:.88rem">${t}</button>`).join("")}</div>`;
  let corpo="";
  if(modo==="temas")corpo=`<p style="font-weight:600;margin:12px 0 6px">1. Escolha o nível</p>
  <div class="lvl">${[0,1,2].map(n=>`<button class="opt ${n===l?"sel":""}" data-l="${n}" style="text-align:center;margin:0">${LV[n].nome}<br><span class="mu">${LV[n].pts} pts cada</span></button>`).join("")}</div>
  <p style="font-weight:600;margin:14px 0 6px">2. Escolha três temas em que se sente à vontade</p>
  <div id="tms">${TEMAS[l].map((t,k)=>`<button class="opt" data-k="${k}" style="padding:10px 12px;min-height:44px">${t}</button>`).join("")}</div>`;
  else if(modo==="solido")corpo=`<p class="mu" style="margin:10px 0">Construa o seu sólido: escolha a forma, as medidas e o ponto onde fica o primeiro vértice (pode ficar em qualquer octante). Depois responde a três perguntas sobre ele (Nível 2, ${LV[1].pts} pontos cada).</p>
  <div class="lvl">${[["cubo","Cubo"],["caixa","Paralelepípedo"],["piramide","Pirâmide"]].map(([f,t])=>`<button class="opt" data-f="${f}" style="text-align:center;margin:0;padding:8px">${t}</button>`).join("")}</div>
  <div id="dims" style="margin-top:8px"></div><div id="pre"></div>`;
  else corpo=`<p class="mu" style="margin:10px 0">Escolha dois pontos do espaço, A e B (coordenadas inteiras de −6 a 6). Depois responde a três perguntas sobre eles (Nível 2, ${LV[1].pts} pontos cada): ponto médio, reta AB e plano perpendicular a AB.</p>
  ${["A","B"].map((P,j)=>`<p style="margin:8px 0 4px;font-weight:600">Ponto ${P}</p><div class="lvl">${["x","y","z"].map((c,i)=>`<label style="font-size:.85rem">${c}<input type="number" min="-6" max="6" step="1" value="${j?[3,-2,4][i]:[1,2,-1][i]}" id="p${P}${i}" style="margin:2px 0 0;padding:8px"></label>`).join("")}</div>`).join("")}
  <div id="pre"></div>`;
  app.innerHTML=`<div class="card"><span class="tag">Três perguntas à sua escolha</span>${tabs}${corpo}
  <div class="ko" id="er"></div>
  <div class="col"><button class="btn" id="ir" disabled>Começar as três perguntas</button><button class="btn sec" id="vt">Voltar</button></div></div>`;
  document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>escolha(l,b.dataset.m));
  vt.onclick=voltar;
  const iniciar=itens=>{S.modo="novas";S.fila=[];S.fp=0;itens.forEach(([lv,it])=>{S.xt[lv].push(it);S.fila.push([lv,S.xt[lv].length-1])});save();pergunta()};
  if(modo==="temas"){
    document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>escolha(+b.dataset.l,"temas"));
    const sel=new Set();
    const valida=()=>{ir.disabled=sel.size!==3;er.textContent=sel.size<3?`Escolhidos: ${sel.size} de 3.`:""};
    tms.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;if(sel.has(k)){sel.delete(k);b.classList.remove("sel")}else if(sel.size<3){sel.add(k);b.classList.add("sel")}valida()});
    ir.onclick=()=>{if(ir.disabled)return;iniciar([...sel].map(k=>[l,{k,t:[{s:semente()}],d:false}]))};
  }else if(modo==="solido"){
    let forma=null;const cfg=()=>{const g=id=>+document.getElementById(id).value;const T=[g("tx"),g("ty"),g("tz")];
      return forma==="cubo"?{tipo:"solido",forma,a:g("da"),T}:forma==="caixa"?{tipo:"solido",forma,a:g("da"),b:g("db"),c:g("dc"),T}:{tipo:"solido",forma,a:g("da"),h:g("dh"),T}};
    const num=(id,lab,v,mn,mx,st)=>`<label style="font-size:.85rem">${lab}<input type="number" id="${id}" value="${v}" min="${mn}" max="${mx}" step="${st||1}" style="margin:2px 0 0;padding:8px"></label>`;
    const prev=()=>{const c=cfg(),ok_=[c.a,c.b||2,c.c||2,c.h||3].every(v=>v>=1&&v<=6)&&c.T.every(v=>Number.isInteger(v)&&Math.abs(v)<=5)&&(forma!=="piramide"||c.a%2===0);
      er.textContent=ok_?"":forma==="piramide"?"A aresta da base da pirâmide tem de ser par (2, 4 ou 6) e as medidas entre 1 e 6.":"As medidas têm de estar entre 1 e 6 e as coordenadas entre −5 e 5.";
      pre.innerHTML=ok_?espaco(solidoAluno(c)):"";ir.disabled=!ok_};
    document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{forma=b.dataset.f;document.querySelectorAll("[data-f]").forEach(x=>x.classList.toggle("sel",x===b));
      dims.innerHTML=`<div class="lvl">${forma==="cubo"?num("da","aresta",3,1,6):forma==="caixa"?num("da","comprimento (x)",4,1,6)+num("db","largura (y)",3,1,6)+num("dc","altura (z)",2,1,6):num("da","aresta da base",4,2,6,2)+num("dh","altura",5,1,6)}</div>
      <p style="margin:8px 0 4px;font-weight:600">Primeiro vértice (P) em:</p><div class="lvl">${num("tx","x",-2,-5,5)+num("ty","y",-3,-5,5)+num("tz","z",1,-5,5)}</div>`;
      dims.querySelectorAll("input").forEach(i=>i.oninput=prev);prev()});
    ir.onclick=()=>{if(ir.disabled)return;const c=cfg();iniciar([0,1,2].map(qi=>[1,{k:-1,cfg:c,qi,t:[{s:semente()}],d:false}]))};
  }else{
    const ler=()=>["A","B"].map(P=>[0,1,2].map(i=>+document.getElementById("p"+P+i).value));
    const prev=()=>{const [A,B]=ler(),ok_=[...A,...B].every(v=>Number.isInteger(v)&&Math.abs(v)<=6)&&A.join()!==B.join();
      er.textContent=ok_?"":"Os pontos têm de ser diferentes, com coordenadas inteiras de −6 a 6.";pre.innerHTML=ok_?espaco({V:{A,B},E:[["A","B"]]}):"";ir.disabled=!ok_};
    document.querySelectorAll("[id^=pA],[id^=pB]").forEach(i=>i.oninput=prev);prev();
    ir.onclick=()=>{if(ir.disabled)return;const [A,B]=ler();iniciar([0,1,2].map(qi=>[1,{k:-1,cfg:{tipo:"pontos",A,B},qi,t:[{s:semente()}],d:false}]))};
  }
  window.scrollTo(0,0);
}

/* ================= Comprovativo, entrega e revisão ================= */
const b64e=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const b64d=t=>JSON.parse(decodeURIComponent(escape(atob(t.replace(/-/g,"+").replace(/_/g,"/")))));
const revisaoAberta=f=>Date.now()>=new Date(f).getTime()+ESPERA_REVISAO_H*3600e3;
const quando=f=>new Date(new Date(f).getTime()+ESPERA_REVISAO_H*3600e3).toLocaleString("pt-PT",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
const compacto=it=>it.map(L=>L&&L.length!==undefined?L.map(x=>{const v=[x.k,x.t.filter(y=>y.a!==undefined&&y.a!==null).map(y=>[y.s,y.a,y.c,y.j===undefined?null:y.j?1:0,y.h||0,y.r||null,y.oct?1:0]),x.o===undefined?null:x.o];if(x.cfg||x.cons)v.push({c:x.cfg,q:x.qi,n:x.cons});return v}):null);
const expandir=c=>c.map(L=>L?L.map(([k,t,o,cu])=>{const x={k,t:t.map(([s,a,c,j,h,r,oc])=>{const y={s,a,c,h};if(j!==null&&j!==undefined)y.j=!!j;if(r)y.r=r;if(oc)y.oct=1;return y})};if(o!==undefined&&o!==null)x.o=o;if(cu){if(cu.c){x.cfg=cu.c;x.qi=cu.q}if(cu.n)x.cons=cu.n}return x}):null);
// lista de temas trocados (para o professor)
const listaTrocas=its=>[0,1,2].flatMap(l=>(its[l]||[]).filter(it=>it.o!==undefined).map(it=>`${LV[l].nome}: «${TEMAS[l][it.o]}» → «${tn(l,it)}»`));
function comp(){
  const d={n:S.nome,t:S.turma,i:S.id,f:S.fim,q:compacto(S.it),x:compacto(S.xt),g:S.gl||[0,0,0],p:total()};
  d.h=hsh(SAL+JSON.stringify(d));
  return location.href.split("#")[0]+"#r="+b64e(d);
}
async function classroom(){
  const u=comp();
  try{await navigator.clipboard.writeText(u)}catch(e){}
  if(navigator.share){try{await navigator.share({title:`Teste P5 – ${S.nome}`,text:`Teste P5 Probabilidade – ${S.nome} – ${fm(total()/10)} valores`,url:u});st.innerHTML='<b>Partilha aberta.</b> Escolha o Classroom, selecione a turma e o trabalho «Teste P5 – Probabilidade» e carregue em <b>Entregar</b>.';return}catch(e){}}
  st.innerHTML='<b>Ligação do comprovativo copiada.</b> No Classroom, abra o trabalho «Teste P5 – Probabilidade», carregue em «Adicionar ou criar › Link», cole a ligação e carregue em <b>Entregar</b>.';
  window.open("https://classroom.google.com/share?url="+encodeURIComponent(u),"_blank");
}
// Revisão completa: todas as perguntas feitas, respostas e explicações
function revisao(its,voltar,xts){xts=xts||S.xt||[[],[],[]];
  let h=`<div class="card"><span class="tag">Revisão do teste</span><p class="mu" style="margin-top:8px">Todas as perguntas respondidas, com a resposta dada, a resposta certa e a explicação.</p></div>`;
  [0,1,2].forEach(l=>{if(!fezNivel(l,its[l],xts[l]))return;
    h+=`<div class="card"><h2>${LV[l].nome} · ${fm(ptsLv(l,its[l],xts[l],(window.GG||S.gl||[])[l]||0))}/${LV[l].pts*10} pontos</h2>`;
    [...(its[l]||[]),...(xts[l]||[]).map(x=>({...x,extra:1}))].forEach((it,n)=>it.t.forEach((u,j)=>{if(u.a===undefined||u.a===null)return;const q=gq(l,it,u),c=u.a===0;
      h+=`<div style="border-left:5px solid ${c?"var(--ok)":"var(--ko)"};padding-left:12px;margin:16px 0">${q.f?q.f():""}<p style="margin:0 0 6px"><b>${it.extra?"Pergunta à escolha":n+1}${j?" (nova pergunta "+j+")":""}.</b> ${q.t}</p>
      <p style="margin:0">Resposta dada: ${q.o[u.a]} <b style="color:${c?"var(--ok)":"var(--ko)"}">${c?"✔ certa":"✘ errada"}</b></p>${c?"":`<p style="margin:0">Resposta certa: ${q.o[0]}</p>`}<p class="mu" style="margin:4px 0 0">${q.x}</p></div>`}));
    h+=`</div>`});
  if(voltar)h+=`<button class="btn sec nop" style="width:100%" id="vt">Voltar ao resultado</button>`;
  app.innerHTML=h;if(voltar)vt.onclick=final;window.scrollTo(0,0);
}
// Abrir um comprovativo (ligação #r=…)
function verComp(code){
  let d;try{d=b64d(code)}catch(e){app.innerHTML='<div class="card"><h2 class="ko">Comprovativo ilegível</h2><p class="mu">A ligação está incompleta ou foi alterada.</p></div>';return}
  const h=d.h;delete d.h;const its=expandir(d.q),xts=d.x?expandir(d.x).map(x=>x||[]):[[],[],[]];
  const gg=d.g||[0,0,0],pts=[0,1,2].map(l=>fezNivel(l,its[l],xts[l])?ptsLv(l,its[l],xts[l],gg[l]):null),tot=pts.reduce((s,x)=>s+(x||0),0);
  const ok=hsh(SAL+JSON.stringify(d))===h&&Math.abs(tot-d.p)<1e-9,v=tot/10,ab=revisaoAberta(d.f);
  app.innerHTML=`<div class="card" style="text-align:center"><span class="tag">Comprovativo do teste P3</span>
  <h2 style="margin:10px 0 4px">${esc(d.n)}</h2><div class="mu">${esc(d.t)} · ${new Date(d.f).toLocaleString("pt-PT")}</div>
  <div class="score" style="margin-top:10px">${fm(v)}<span class="mu" style="font-size:1.3rem"> valores</span></div><div class="mc">${mencao(v)}</div>
  <div class="mu" style="margin-top:8px">${fm(tot)} de 200 pontos · código ${esc(d.i)}</div>
  <div class="lvl">${[0,1,2].map(l=>`<div>${LV[l].nome}<b>${pts[l]===null?"—":fm(pts[l])+"/"+LV[l].pts*10}</b></div>`).join("")}</div>
  ${listaTrocas(its).length?`<p class="mu" style="margin:6px 0 0">Perguntas trocadas (valem metade): ${listaTrocas(its).join("; ")}</p>`:""}
  <p style="font-weight:700;margin:10px 0 0;color:${ok?"var(--ok)":"var(--ko)"}">${ok?"✔ Comprovativo íntegro (código "+h+")":"⚠ Atenção: os dados deste comprovativo foram alterados"}</p></div>
  <div class="card nop col"><button class="btn sec" id="rv" ${ab?"":"disabled"}>${ab?"Ver o teste completo":"Revisão completa disponível a partir de "+quando(d.f)}</button><button class="btn sec" onclick="print()">Imprimir / guardar PDF</button></div>`;
  if(ab)rv.onclick=()=>{window.GG=gg;revisao(its,false,xts)};
}

new MutationObserver(()=>lado()).observe(document.getElementById("app"),{childList:true});
document.getElementById("fbtn").onclick=()=>{FORM_ABERTO=!FORM_ABERTO;if(S){S.form=(S.form||0)+(FORM_ABERTO?1:0);save()}lado();if(FORM_ABERTO&&innerWidth<1000)document.getElementById("side").lastElementChild.scrollIntoView({behavior:"smooth",block:"start"})};
/* ================= Arranque =================
   O progresso fica guardado neste telemóvel: recarregar a página retoma o teste (não recomeça).
   Para limpar (professor): abrir o endereço com #reiniciar no fim. */
if(location.hash==="#reiniciar"){try{localStorage.removeItem(CHAVE)}catch(e){}history.replaceState(null,"",location.pathname)}
S=load();
if(S&&!S.it)S=null; // versão antiga guardada
if(S&&!S.xt){S.xt=[[],[],[]];S.usado={};S.modo=null;S.fila=[];S.fp=0}
if(S&&!S.gl)S.gl=[0,0,0];
if(location.hash.startsWith("#r="))verComp(location.hash.slice(3));
else if(!S)home();else if(S.modo)pergunta();else if(S.fim)final();else if(S.it[S.lv]&&S.i<10)pergunta();else fimNivel();
</script>
